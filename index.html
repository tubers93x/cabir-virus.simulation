<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cabir Virus Simulator (2004)</title>
    <style>
        body { background: #222; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        /* Teléfono más grande */
        .phone { width: 340px; background: #343a40; border-radius: 30px; padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); text-align: center; border: 4px solid #495057; }
        /* Pantalla expandida */
        .screen { height: 260px; background: #9bbc0f; color: #0f380f; border: 5px solid #111; border-radius: 8px; padding: 15px; position: relative; font-size: 16px; display: flex; flex-direction: column; justify-content: center; }
        .popup { background: #9bbc0f; border: 3px solid #0f380f; position: absolute; top: 12px; bottom: 12px; left: 12px; right: 12px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .btn { background: #007bff; border: none; color: white; padding: 15px; margin-top: 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 14px; box-shadow: 0 4px #0056b3; }
        .btn:active { background: #0056b3; transform: translateY(2px); box-shadow: 0 2px #003f82; }
    </style>
</head>
<body>

    <h2 style="color: #00ff00; margin-bottom: 5px;">Cabir Virus Simulator</h2>
    <p style="color: #aaa; font-size: 13px; margin-top: 0;">Click the button below to trigger the infection timeline.</p>

    <div class="phone">
        <div class="screen" id="screen">
            <div id="status">🔵 Bluetooth Searching...</div>
            <div style="font-size: 45px; margin: 15px 0;">📱</div>
            <b style="font-size: 18px;">Nokia 6600</b>

            <!-- Dynamic Alert Box -->
            <div class="popup" id="popup" style="display:none;">
                <b id="pop-title" style="letter-spacing: 1px;">MESSAGE RECEIVED</b>
                <span id="pop-body">Accept 'caribe.sis' via Bluetooth from unknown device?</span>
                <b style="font-size: 12px; color: #333;">[ PRESS THE BUTTON ]</b>
            </div>
        </div>
        <button class="btn" onclick="nextStep()">START INFECTION</button>
    </div>

    <script>
        let step = 0;
        const pop = document.getElementById('popup');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Sintetizador de sonido monofónico clásico
        function playBeep(frequency, duration, type = 'sine') {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.value = frequency;
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); // Volumen bajo y cómodo
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        // Tonos retro generados por código
        function playRetroNotification() {
            playBeep(880, 0.1); 
            setTimeout(() => playBeep(880, 0.1), 150);
            setTimeout(() => playBeep(1760, 0.2), 300);
        }

        function playInfectionError() {
            playBeep(220, 0.3, 'sawtooth');
            setTimeout(() => playBeep(147, 0.5, 'sawtooth'), 250);
        }

        function nextStep() {
            // Activa el contexto de audio en navegadores modernos que requieren interacción del usuario
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            step++;
            const mainBtn = document.querySelector('.btn');

            if (step === 1) {
                pop.style.display = 'flex';
                playRetroNotification(); // Sonido de mensaje entrante
                mainBtn.innerText = 'ACCEPT FILE';
            } else if (step === 2) {
                document.getElementById('pop-title').innerText = 'INSTALLER';
                document.getElementById('pop-body').innerText = 'Install application "Caribe"? Warning: Unknown supplier.';
                playBeep(660, 0.15); // Sonido de alerta intermedio
                mainBtn.innerText = 'CONTINUE INSTALLATION';
            } else if (step === 3) {
                // Pantalla final modificada por el virus Cabir
                const screen = document.getElementById('screen');
                screen.style.background = '#0f380f';
                screen.style.color = '#9bbc0f';
                screen.innerHTML = '<h1 style="margin:0; font-size:38px; letter-spacing:3px;">Caribe</h1><p style="font-size:12px; margin-top:15px;">INFECTED BY 29A<br><br>Draining battery... 🔋</p>';
                
                playInfectionError(); // Sonido distorsionado de fallo del sistema
                
                mainBtn.innerText = 'DEVICE INFECTED';
                mainBtn.style.background = '#dc3545';
                mainBtn.style.boxShadow = 'none';
                mainBtn.disabled = true;
            }
        }
    </script>

</body>
</html>
